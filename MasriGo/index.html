<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MasriGo — Belajar Bahasa Arab Mesir</title>
  <meta name="description" content="MasriGo: belajar bahasa Arab Mesir (Masri) dari nol lewat game, kartu kosakata, dan percakapan.">
  <meta name="theme-color" content="#FFB6C8">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Cairo:wght@500;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#view">Lewati ke konten</a>
  <header class="top">
    <a class="brand" href="#/home" aria-label="MasriGo, ke beranda">
      <img src="assets/icons/favicon.svg" alt="" width="38" height="38"><span>MasriGo</span>
    </a>
    <nav id="mainNav" aria-label="Navigasi utama">
      <a data-page="home" href="#/home"><i aria-hidden="true">🏠</i><span>Beranda</span></a>
      <a data-page="map" href="#/map"><i aria-hidden="true">🗺️</i><span>Peta</span></a>
      <a data-page="games" href="#/games"><i aria-hidden="true">🎮</i><span>Game</span></a>
      <a data-page="flashcards" href="#/flashcards"><i aria-hidden="true">🃏</i><span>Kartu</span></a>
      <a data-page="conversation" href="#/conversation"><i aria-hidden="true">🗣️</i><span>Bicara</span></a>
      <a data-page="achievements" href="#/achievements"><i aria-hidden="true">🏆</i><span>Prestasi</span></a>
      <a data-page="settings" href="#/settings"><i aria-hidden="true">⚙️</i><span>Setelan</span></a>
    </nav>
    <div id="hud" class="hud" aria-label="Poin dan hari beruntun"></div>
  </header>

  <main id="view" tabindex="-1">
    <noscript><p class="card">MasriGo membutuhkan JavaScript. Aktifkan JavaScript di browsermu ya.</p></noscript>
  </main>

  <button id="repeatBtn" class="repeat" hidden aria-label="Ulangi suara terakhir">🔁 Ulangi suara</button>
  <div id="toasts" aria-live="polite"></div>

  <script src="js/lessons.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/games.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
